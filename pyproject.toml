[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "hybrid-movie-recommender"
version = "0.1.0"
description = "Hybrid Content-Based Movie Recommendation"
readme = "README.md"
requires-python = ">=3.11.0"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
    "torch==2.15.0"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu134", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/movie_recommender"]
  